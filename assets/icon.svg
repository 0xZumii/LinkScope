<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="LinkScope icon">
  <title>LinkScope</title>

  <rect width="128" height="128" rx="28" fill="#12151c"/>

  <!-- Crosshair ticks -->
  <g stroke="#6fd3a3" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <line x1="64" y1="20" x2="64" y2="36"/>
    <line x1="64" y1="92" x2="64" y2="108"/>
    <line x1="20" y1="64" x2="36" y2="64"/>
    <line x1="92" y1="64" x2="108" y2="64"/>
  </g>

  <!-- Reticle ring -->
  <circle cx="64" cy="64" r="39" fill="none" stroke="#6fd3a3" stroke-width="4.5" opacity="0.4"/>

  <!-- The link -->
  <rect x="37" y="49" width="54" height="30" rx="15"
        transform="rotate(45 64 64)"
        fill="none" stroke="#6fd3a3" stroke-width="8.5" stroke-linejoin="round"/>
</svg>
