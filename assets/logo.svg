<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LinkScope logo">
  <title>LinkScope</title>

  <!-- Rounded dark tile -->
  <rect width="512" height="512" rx="112" fill="#12151c"/>

  <!-- Crosshair through the center -->
  <g stroke="#6fd3a3" stroke-width="20" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="84" x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="428"/>
    <line x1="84" y1="256" x2="150" y2="256"/>
    <line x1="362" y1="256" x2="428" y2="256"/>
  </g>

  <!-- Reticle ring -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#6fd3a3" stroke-width="18" opacity="0.4"/>

  <!-- The link: one bold oval ring, centered -->
  <rect x="150" y="196" width="212" height="120" rx="60"
        transform="rotate(45 256 256)"
        fill="none" stroke="#6fd3a3" stroke-width="34" stroke-linejoin="round"/>
</svg>
